# Reduced from the reported SteamOS config; filesystem identifiers are synthetic.
### BEGIN /etc/grub.d/00_header ###
insmod steamenv
steamenv_loader_mode=auto
steamenv_init
### END /etc/grub.d/00_header ###
### BEGIN /etc/grub.d/10_linux ###
menuentry 'SteamOS' --class steamos {
        insmod steamenv
        steamenv_boot   linux /boot/vmlinuz-linux-neptune-72 console=tty1 rd.systemd.gpt_auto=no quiet splash resume=/dev/disk/by-uuid/12345678-abcd-1234-5678-123456789abc resume_offset=12345
        initrd /boot/amd-ucode.img /boot/initramfs-linux-neptune-72.img
}
submenu 'Advanced options for SteamOS' {
        menuentry 'SteamOS, with Linux linux-neptune-72' --class steamos {
                steamenv_boot   linux /boot/vmlinuz-linux-neptune-72 console=tty1 quiet splash resume=/dev/disk/by-uuid/12345678-abcd-1234-5678-123456789abc resume_offset=12345
                initrd /boot/amd-ucode.img /boot/initramfs-linux-neptune-72.img
        }
}
### END /etc/grub.d/10_linux ###
